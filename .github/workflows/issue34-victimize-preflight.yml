name: Issue 34 Victimize validation

on:
  push:
    branches: [ "issue-34-victimize" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: issue-34-victimize

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install just
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Victimize scenario gate
        run: |
          set -euxo pipefail
          just test-class VictimizeScenarioTest

      - name: Rebless and scope card snapshot
        id: snapshot
        run: |
          set -euxo pipefail
          just rebless-cards
          echo '--- changed files after rebless ---'
          git diff --name-only
          NON_SNAPSHOT=$(git diff --name-only | grep -vE '(^|/)snapshots/cards/[Uu][Ss][Gg]\.json$' || true)
          if [ -n "$NON_SNAPSHOT" ]; then
            echo "Unexpected rebless changes:"
            echo "$NON_SNAPSHOT"
            exit 1
          fi
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Full card build gate
        run: |
          set -euxo pipefail
          just build

      - name: Assay differential
        run: |
          set -uxo pipefail
          just assay-differential --set USG
          STATUS=$?
          echo "assay_differential_status=$STATUS"
          exit 0

      - name: Canonical printing gate
        run: |
          set -euxo pipefail
          just check-card-printing "Victimize"

      - name: Preserve verified snapshot on branch
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*snapshots/cards/[Uu][Ss][Gg].json'
          git commit -m 'Update Victimize card snapshot'
          git push origin HEAD:issue-34-victimize
