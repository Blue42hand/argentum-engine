name: Riveteers Overlook add-card validation

on:
  push:
    branches: [ "codex/issue-19-riveteers-overlook" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Fetch canonical Scryfall evidence
        run: |
          set -euo pipefail
          mkdir -p riveteers-overlook-evidence
          curl --fail --silent --show-error --location \
            --get 'https://api.scryfall.com/cards/named' \
            --data-urlencode 'exact=Riveteers Overlook' \
            --data-urlencode 'set=snc' \
            -o riveteers-overlook-evidence/snc.json
          jq '{name,set,set_name,collector_number,rarity,released_at,artist,image_uris,oracle_id,id,type_line,oracle_text,flavor_text,rulings_uri,prints_search_uri}' \
            riveteers-overlook-evidence/snc.json | tee riveteers-overlook-evidence/snc-summary.json
          RULINGS_URI=$(jq -r '.rulings_uri' riveteers-overlook-evidence/snc.json)
          PRINTS_URI=$(jq -r '.prints_search_uri' riveteers-overlook-evidence/snc.json)
          curl --fail --silent --show-error --location "$RULINGS_URI" -o riveteers-overlook-evidence/rulings.json
          curl --fail --silent --show-error --location "$PRINTS_URI" -o riveteers-overlook-evidence/printings.json
          jq '[.data[] | {set,set_name,collector_number,rarity,released_at,artist,id,image_uris,lang,games,promo_types}]' \
            riveteers-overlook-evidence/printings.json | tee riveteers-overlook-evidence/printings-summary.json
          jq '.data' riveteers-overlook-evidence/rulings.json | tee riveteers-overlook-evidence/rulings-summary.json

      - name: Assay and fidelity preflight
        shell: bash
        run: |
          set -o pipefail
          just assay parse "Riveteers Overlook" 2>&1 | tee riveteers-overlook-evidence/assay-parse.txt || true
          just assay explain "Riveteers Overlook" 2>&1 | tee riveteers-overlook-evidence/assay-explain.txt || true
          just coverage-fidelity --emit "Riveteers Overlook" 2>&1 | tee riveteers-overlook-evidence/fidelity-emit.txt || true

      - name: Rebless card snapshots
        run: just rebless-cards

      - name: Capture snapshot delta
        shell: bash
        run: |
          git status --short > riveteers-overlook-evidence/status.txt
          git diff > riveteers-overlook-evidence/snapshot.patch
          git diff --name-only > riveteers-overlook-evidence/changed-files.txt
          cat riveteers-overlook-evidence/status.txt
          cat riveteers-overlook-evidence/changed-files.txt
          mkdir -p riveteers-overlook-evidence/modified
          while IFS= read -r path; do
            if [ -n "$path" ] && [ -f "$path" ]; then
              mkdir -p "riveteers-overlook-evidence/modified/$(dirname "$path")"
              cp "$path" "riveteers-overlook-evidence/modified/$path"
            fi
          done < riveteers-overlook-evidence/changed-files.txt

      - name: Build with reblessed snapshot
        run: just build

      - name: Assay differential for SNC
        shell: bash
        run: |
          set -o pipefail
          just assay-differential --set SNC 2>&1 | tee riveteers-overlook-evidence/assay-differential.txt

      - name: Check printing registrations
        id: printing
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          just check-card-printing "Riveteers Overlook" 2>&1 | tee riveteers-overlook-evidence/printing-gate.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: riveteers-overlook-validation
          path: riveteers-overlook-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Fail if printing gate failed
        if: steps.printing.outcome != 'success'
        run: exit 1

      - name: Finalize validated card changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/SNC.json
          git rm .github/workflows/riveteers-overlook-probe.yml
          git diff --cached --check
          git commit -m "test: rebless Riveteers Overlook snapshot"
          git push origin HEAD:codex/issue-19-riveteers-overlook
