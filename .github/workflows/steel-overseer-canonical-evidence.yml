name: Steel Overseer canonical Scryfall evidence

on:
  push:
    branches: ["codex/issue-19-steel-overseer"]

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact M11 metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          q = '!"Steel Overseer" set:m11'
          url = "https://api.scryfall.com/cards/search?q=" + urllib.parse.quote(q)
          req = urllib.request.Request(url, headers={
              "User-Agent": "argentum-engine-steel-overseer-validation/1.0",
              "Accept": "application/json",
          })
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode("utf-8"))
          cards = data.get("data", [])
          if len(cards) != 1:
              raise SystemExit(f"expected exactly one M11 Steel Overseer printing, got {len(cards)}")
          card = cards[0]
          row = {
              "set": card.get("set"),
              "set_name": card.get("set_name"),
              "collector_number": card.get("collector_number"),
              "scryfall_id": card.get("id"),
              "oracle_id": card.get("oracle_id"),
              "artist": card.get("artist"),
              "flavor_text": card.get("flavor_text"),
              "image_uri": (card.get("image_uris") or {}).get("normal"),
              "released_at": card.get("released_at"),
              "rarity": card.get("rarity"),
              "oracle_text": card.get("oracle_text"),
              "mana_cost": card.get("mana_cost"),
              "type_line": card.get("type_line"),
              "power": card.get("power"),
              "toughness": card.get("toughness"),
              "rulings_uri": card.get("rulings_uri"),
          }
          with open("steel-overseer-m11.json", "w", encoding="utf-8") as fh:
              json.dump(row, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(row, indent=2, sort_keys=True))
          PY

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: steel-overseer-m11-scryfall
          path: steel-overseer-m11.json
          if-no-files-found: error
