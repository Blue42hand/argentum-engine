name: Steel Overseer source audit

on:
  push:
    branches: ["codex/issue-19-steel-overseer"]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Audit filter and mass-counter primitives
        shell: bash
        run: |
          {
            echo '===== CreatureOrArtifact definitions/usages ====='
            rg -n -B 12 -A 20 'CreatureOrArtifact' mtg-sdk mtg-sets || true
            echo
            echo '===== ForEachInGroup card usages ====='
            rg -n -B 12 -A 24 'ForEachInGroup' mtg-sets | head -n 700 || true
            echo
            echo '===== AddCountersToCollection definitions/usages ====='
            rg -n -B 12 -A 24 'AddCountersToCollection' mtg-sdk mtg-sets | head -n 700 || true
            echo
            echo '===== GameObjectFilter type predicate definitions ====='
            rg -n -B 10 -A 30 'sealed (class|interface) GameObjectFilter|data class GameObjectFilter|class GameObjectFilter|object CreatureOrArtifact|val CreatureOrArtifact' mtg-sdk || true
          } > steel-overseer-source-audit.txt
          cat steel-overseer-source-audit.txt

      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: steel-overseer-source-audit
          path: steel-overseer-source-audit.txt
          if-no-files-found: error
