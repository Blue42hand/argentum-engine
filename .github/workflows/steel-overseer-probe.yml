name: Steel Overseer source audit

on:
  push:
    branches: ["codex/issue-19-steel-overseer"]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Audit filter and mass-counter primitives
        shell: bash
        run: |
          {
            echo '===== filter files ====='
            find mtg-sdk -type f -name '*Filter*.kt' | sort
            echo
            echo '===== CreatureOrArtifact definitions/usages ====='
            grep -R -n -B 12 -A 20 'CreatureOrArtifact' mtg-sdk mtg-sets 2>&1 || true
            echo
            echo '===== ForEachInGroup card usages ====='
            grep -R -n -B 12 -A 24 'ForEachInGroup' mtg-sets 2>&1 | head -n 700 || true
            echo
            echo '===== AddCountersToCollection definitions/usages ====='
            grep -R -n -B 12 -A 24 'AddCountersToCollection' mtg-sdk mtg-sets 2>&1 | head -n 700 || true
            echo
            echo '===== GameObjectFilter declarations ====='
            grep -R -n -B 10 -A 35 'GameObjectFilter' mtg-sdk/src/main/kotlin 2>&1 | head -n 900 || true
          } > steel-overseer-source-audit.txt
          cat steel-overseer-source-audit.txt

      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: steel-overseer-source-audit
          path: steel-overseer-source-audit.txt
          if-no-files-found: error
