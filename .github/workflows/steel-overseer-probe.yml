name: Steel Overseer add-card validation

on:
  push:
    branches: ["codex/issue-19-steel-overseer"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Rebless card snapshots
        run: just rebless-cards

      - name: Capture snapshot delta
        shell: bash
        run: |
          git status --short > steel-overseer-status.txt
          git diff > steel-overseer-snapshot.patch
          git diff --name-only > steel-overseer-changed-files.txt
          cat steel-overseer-status.txt
          cat steel-overseer-changed-files.txt

      - name: Fetch exact Scryfall reprint metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request

          wanted = ["ddf", "m20", "c21", "j22"]
          rows = []
          for set_code in wanted:
              q = f'!"Steel Overseer" set:{set_code}'
              url = "https://api.scryfall.com/cards/search?q=" + urllib.parse.quote(q)
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "argentum-engine-steel-overseer-validation/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode("utf-8"))
              cards = data.get("data", [])
              if len(cards) != 1:
                  raise SystemExit(f"expected exactly one {set_code} Steel Overseer printing, got {len(cards)}")
              card = cards[0]
              rows.append({
                  "set": card.get("set"),
                  "set_name": card.get("set_name"),
                  "collector_number": card.get("collector_number"),
                  "scryfall_id": card.get("id"),
                  "oracle_id": card.get("oracle_id"),
                  "artist": card.get("artist"),
                  "image_uri": (card.get("image_uris") or {}).get("normal"),
                  "released_at": card.get("released_at"),
                  "rarity": card.get("rarity"),
              })
              time.sleep(0.15)

          with open("steel-overseer-printings.json", "w", encoding="utf-8") as fh:
              json.dump(rows, fh, indent=2, sort_keys=True)
              fh.write("\n")
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY

      - name: Preserve modified snapshot files early
        shell: bash
        run: |
          mkdir -p steel-overseer-modified
          while IFS= read -r path; do
            if [ -n "$path" ] && [ -f "$path" ]; then
              mkdir -p "steel-overseer-modified/$(dirname "$path")"
              cp "$path" "steel-overseer-modified/$path"
            fi
          done < steel-overseer-changed-files.txt

      - name: Upload snapshot and Scryfall evidence early
        uses: actions/upload-artifact@v4
        with:
          name: steel-overseer-early-evidence
          path: |
            steel-overseer-status.txt
            steel-overseer-changed-files.txt
            steel-overseer-snapshot.patch
            steel-overseer-printings.json
            steel-overseer-modified/
          if-no-files-found: error

      - name: Commit generated snapshot
        shell: bash
        run: |
          if git diff --quiet -- mtg-sets/src/test/resources/snapshots/cards/M11.json; then
            echo "M11 snapshot already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mtg-sets/src/test/resources/snapshots/cards/M11.json
          git commit -m "test: rebless M11 card snapshot"
          git push origin HEAD:codex/issue-19-steel-overseer

      - name: Build with reblessed snapshot
        run: just build

      - name: Assay differential for M11
        shell: bash
        run: |
          set -o pipefail
          just assay-differential --set M11 2>&1 | tee steel-overseer-assay-differential.txt

      - name: Check printing registrations
        id: printing
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          just check-card-printing "Steel Overseer" 2>&1 | tee steel-overseer-printing-gate.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steel-overseer-validation
          path: |
            steel-overseer-status.txt
            steel-overseer-changed-files.txt
            steel-overseer-snapshot.patch
            steel-overseer-printings.json
            steel-overseer-assay-differential.txt
            steel-overseer-printing-gate.txt
            steel-overseer-modified/
          if-no-files-found: warn

      - name: Fail if printing gate failed
        if: steps.printing.outcome != 'success'
        run: exit 1
