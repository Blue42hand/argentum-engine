name: Issue 19 refresh RIX snapshot

on:
  push:
    branches:
      - codex/issue-19-pitiless-plunderer

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/issue-19-pitiless-plunderer
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Re-bless card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true
      - name: Verify bounded snapshot change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short | awk '{print $2}' | grep -v '^\.github/workflows/issue-19-refresh-rix-snapshot.yml$' || true)"
          test "$changed" = "mtg-sets/src/test/resources/snapshots/cards/RIX.json"
          grep -q '// Pitiless Plunderer' mtg-sets/src/test/resources/snapshots/cards/RIX.json
      - name: Commit snapshot and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-19-refresh-rix-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mtg-sets/src/test/resources/snapshots/cards/RIX.json .github/workflows/issue-19-refresh-rix-snapshot.yml
          git commit -m 'Refresh RIX snapshot for Pitiless Plunderer'
          git push origin HEAD:codex/issue-19-pitiless-plunderer
