name: Pitiless Plunderer preflight

on:
  push:
    branches:
      - codex/issue-19-pitiless-plunderer

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch canonical Scryfall evidence
        shell: bash
        run: |
          set -euo pipefail
          CARD_URL='https://api.scryfall.com/cards/named?exact=Pitiless%20Plunderer&set=rix'
          curl -fsSL -A 'CommanderGym-ArgentumCoverage/1.0' "$CARD_URL" -o /tmp/card.json
          python3 - <<'PY'
          import json
          with open('/tmp/card.json') as f:
              d=json.load(f)
          fields=['name','mana_cost','type_line','oracle_text','power','toughness','colors','color_identity','rarity','collector_number','artist','flavor_text','released_at','set','set_name','rulings_uri','prints_search_uri']
          print('SCRYFALL_CARD')
          for k in fields:
              print(f'{k}={d.get(k)!r}')
          print(f"image_normal={d.get('image_uris',{}).get('normal')!r}")
          PY
          RULINGS_URL="$(python3 -c 'import json; print(json.load(open("/tmp/card.json"))["rulings_uri"])')"
          PRINTS_URL="$(python3 -c 'import json; print(json.load(open("/tmp/card.json"))["prints_search_uri"])')"
          curl -fsSL -A 'CommanderGym-ArgentumCoverage/1.0' "$RULINGS_URL" -o /tmp/rulings.json
          curl -fsSL -A 'CommanderGym-ArgentumCoverage/1.0' "$PRINTS_URL" -o /tmp/prints.json
          python3 - <<'PY'
          import json
          print('SCRYFALL_RULINGS')
          for r in json.load(open('/tmp/rulings.json')).get('data',[]):
              print(r.get('published_at'), r.get('comment'))
          print('SCRYFALL_PRINTINGS')
          for p in sorted(json.load(open('/tmp/prints.json')).get('data',[]), key=lambda x:x.get('released_at','')):
              print(p.get('released_at'), p.get('set'), p.get('collector_number'), p.get('promo'), p.get('set_type'), p.get('name'))
          PY
      - name: Assay and fidelity preflight
        shell: bash
        run: |
          set -euo pipefail
          just assay parse 'Pitiless Plunderer' || true
          just assay explain 'Pitiless Plunderer' || true
          just coverage-fidelity --emit 'Pitiless Plunderer' || true
          just where RIX
