name: Issue 27 Generous Gift validation

on:
  push:
    branches: [issue-27-generous-gift]
    paths:
      - '.github/workflows/issue27-preflight.yml'
      - 'mtg-sets/2017-2022/src/main/kotlin/com/wingedsheep/mtg/sets/definitions/mh1/cards/GenerousGift.kt'
      - 'mtg-sets/2017-2022/tests/src/test/kotlin/com/wingedsheep/engine/scenarios/GenerousGiftScenarioTest.kt'

concurrency:
  group: issue-27-generous-gift-validation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - uses: extractions/setup-just@v2
      - name: Rules scenarios
        run: just test-class GenerousGiftScenarioTest
      - name: Rebless card snapshot locally
        shell: bash
        run: |
          set -euo pipefail
          just rebless-cards
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'Expected a new Generous Gift card snapshot, but rebless produced no diff.' >&2
            exit 1
          fi
          printf 'Rebless changed:\n%s\n' "${changed[@]}"
          for file in "${changed[@]}"; do
            case "$file" in
              *snapshots/cards/*) ;;
              *) echo "Unexpected rebless change: $file" >&2; exit 1 ;;
            esac
          done
          git diff --stat
      - name: Card gates
        shell: bash
        run: |
          set -euo pipefail
          just build
          just assay-differential --set MH1
          just check-card-printing 'Generous Gift'
      - name: Preserve verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for file in "${changed[@]}"; do
            case "$file" in
              *snapshots/cards/*) ;;
              *) echo "Unexpected generated change before snapshot commit: $file" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${changed[@]}"
          git commit -m 'Rebless Generous Gift snapshot'
          git push origin HEAD:issue-27-generous-gift
