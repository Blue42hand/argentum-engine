name: Issue 19 Cloud Key add-card gate

on:
  push:
    branches:
      - automation/issue-19-cloud-key-card

permissions:
  contents: write

jobs:
  validate-and-bless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/issue-19-cloud-key-card
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Re-bless card snapshots
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked :mtg-sets:test --tests '*CardDefinitionSnapshotTest' -DupdateSnapshots=true
          mapfile -t changed < <(git diff --name-only)
          printf 'Snapshot changes:\n%s\n' "${changed[*]:-<none>}"
          test "${#changed[@]}" -eq 1
      - name: Existing-primitives build gate
        run: scripts/gradle-locked build
      - name: Assay differential for Future Sight
        shell: bash
        run: |
          set -euo pipefail
          scripts/gradle-locked -q --console=plain :oracle-assay:installDist
          oracle-assay/build/install/oracle-assay/bin/oracle-assay differential --set FUT | tee /tmp/cloud-key-assay.txt
          echo 'Cloud Key differential rows:'
          grep -i 'Cloud Key' /tmp/cloud-key-assay.txt || true
      - name: Canonical printing check
        run: scripts/gradle-locked :rules-engine:run --args='--check-card-printing "Cloud Key"'
      - name: Commit only the expected snapshot and remove temporary gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[0]}"
          git rm .github/workflows/issue-19-cloud-key-validate.yml
          git commit -m 'Bless Cloud Key card snapshot'
          git push origin HEAD:automation/issue-19-cloud-key-card
