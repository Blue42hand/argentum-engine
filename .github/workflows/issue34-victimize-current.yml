name: Issue 34 Victimize current-main validation

on:
  push:
    branches: [ "codex/issue-34-victimize-current" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: codex/issue-34-victimize-current

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install just
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/just" --version

      - name: Assay parse and explain
        run: |
          set -uxo pipefail
          just assay parse "Victimize"
          PARSE_STATUS=$?
          just assay explain "Victimize"
          EXPLAIN_STATUS=$?
          echo "assay_parse_status=$PARSE_STATUS assay_explain_status=$EXPLAIN_STATUS"
          exit 0

      - name: Fidelity draft
        run: |
          set -uxo pipefail
          just coverage-fidelity --emit "Victimize"
          STATUS=$?
          echo "coverage_fidelity_status=$STATUS"
          exit 0

      - name: Scryfall evidence
        run: |
          set -euxo pipefail
          UA='CommanderGym-Argentum-coverage/1.0'
          ACCEPT='application/json;q=0.9,*/*;q=0.8'
          curl --fail --silent --show-error -H "User-Agent: $UA" -H "Accept: $ACCEPT" \
            'https://api.scryfall.com/cards/named?exact=Victimize' > /tmp/victimize.json
          jq '{name,mana_cost,type_line,oracle_text,set,set_name,released_at,collector_number,rarity,artist,image_uris,rulings_uri,prints_search_uri}' /tmp/victimize.json
          RULINGS=$(jq -r '.rulings_uri' /tmp/victimize.json)
          PRINTS=$(jq -r '.prints_search_uri' /tmp/victimize.json)
          echo '--- rulings ---'
          curl --fail --silent --show-error -H "User-Agent: $UA" -H "Accept: $ACCEPT" "$RULINGS" | jq '.data[] | {published_at,comment}'
          echo '--- printings oldest first ---'
          curl --fail --silent --show-error -H "User-Agent: $UA" -H "Accept: $ACCEPT" "$PRINTS&order=released&dir=asc" | jq '.data[] | select(.set_type != "promo" and .set_type != "token" and .set_type != "art_series" and .set_type != "memorabilia") | {set,set_name,set_type,released_at,collector_number,rarity,artist,image_uris}'
          echo '--- canonical USG printing ---'
          curl --fail --silent --show-error -H "User-Agent: $UA" -H "Accept: $ACCEPT" \
            'https://api.scryfall.com/cards/named?exact=Victimize&set=usg' | \
            jq '{name,mana_cost,type_line,oracle_text,set,set_name,released_at,collector_number,rarity,artist,flavor_text,image_uris}'

      - name: Victimize scenario gate
        run: |
          set -euxo pipefail
          just test-class VictimizeScenarioTest

      - name: Rebless and scope card snapshot
        id: snapshot
        run: |
          set -euxo pipefail
          just rebless-cards
          echo '--- changed files after rebless ---'
          git diff --name-only
          NON_SNAPSHOT=$(git diff --name-only | grep -vE '(^|/)snapshots/cards/USG\.json$' || true)
          if [ -n "$NON_SNAPSHOT" ]; then
            echo "Unexpected rebless changes:"
            echo "$NON_SNAPSHOT"
            exit 1
          fi
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Full card build gate
        run: |
          set -euxo pipefail
          just build

      - name: Assay differential
        run: |
          set -uxo pipefail
          just assay-differential --set USG
          STATUS=$?
          echo "assay_differential_status=$STATUS"
          exit 0

      - name: Canonical printing gate
        run: |
          set -euxo pipefail
          just check-card-printing "Victimize"

      - name: Preserve verified snapshot on branch
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'mtg-sets/src/test/resources/snapshots/cards/USG.json'
          git commit -m 'Update Victimize card snapshot'
          git push origin HEAD:codex/issue-34-victimize-current
