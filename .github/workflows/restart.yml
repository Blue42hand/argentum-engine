name: Restart

# Restarts the running containers on the server without pulling new images or rewriting .env —
# the same build stays deployed. Use Deploy to ship a new build.
on:
  workflow_dispatch:
    inputs:
      service:
        description: "Compose service to restart (leave empty for all)"
        required: false
        default: ""

jobs:
  restart:
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Restart via SSH
        uses: appleboy/ssh-action@v1
        env:
          SERVICE: ${{ inputs.service }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: SERVICE
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose restart $SERVICE
            docker compose ps
