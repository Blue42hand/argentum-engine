name: Arcane Denial add-card gates

on:
  push:
    branches: ["codex/issue-123-arcane-denial"]

permissions:
  contents: read

jobs:
  add-card-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Assay
        run: scripts/gradle-locked -q --console=plain :oracle-assay:installDist

      - name: Assay differential — Alliances
        run: oracle-assay/build/install/oracle-assay/bin/oracle-assay differential --set ALL

      - name: Canonical printing — Scryfall
        run: python3 scripts/check-card-printing.py "Arcane Denial"

      - name: Persist Scryfall printing evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          wanted = {"c13", "c16", "cmr", "voc", "woc", "otc", "soc", "msc"}
          cache = Path.home().joinpath(".cache/scryfall/printings/arcane-denial.json")
          output = Path("arcane-denial-printings.jsonl")
          if not cache.exists():
              output.write_text("", encoding="utf-8")
              raise SystemExit(0)

          rows = json.loads(cache.read_text(encoding="utf-8"))
          evidence = []
          for row in rows:
              if row["set_code"] not in wanted:
                  continue
              time.sleep(0.12)
              req = urllib.request.Request(
                  f"https://api.scryfall.com/cards/{row['scryfall_id']}",
                  headers={"User-Agent": "argentum-engine-arcane-denial-proof/1.0", "Accept": "application/json"},
              )
              with urllib.request.urlopen(req) as resp:
                  card = json.loads(resp.read().decode("utf-8"))
              evidence.append({
                  "set_code": card["set"],
                  "set_name": card["set_name"],
                  "collector_number": card["collector_number"],
                  "oracle_id": card["oracle_id"],
                  "scryfall_id": card["id"],
                  "artist": card.get("artist"),
                  "image_uri": (card.get("image_uris") or {}).get("normal"),
                  "released_at": card["released_at"],
                  "rarity": card["rarity"],
              })
          output.write_text("\n".join(json.dumps(row, sort_keys=True) for row in evidence) + "\n", encoding="utf-8")
          PY

      - name: Upload Scryfall printing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcane-denial-printings
          path: arcane-denial-printings.jsonl
          if-no-files-found: error

      - name: Verify snapshot stays clean
        if: success()
        run: |
          ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest"
          git diff --exit-code
