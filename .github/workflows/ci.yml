name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  snapshot-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate and print C19 snapshot mismatch
        shell: bash
        run: |
          set +e
          ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest"
          STATUS=$?
          set -e
          SNAPSHOT="mtg-sets/build/snapshots-actual/snapshots/cards/C19.json"
          if [ -f "$SNAPSHOT" ]; then
            echo "=== BEGIN C19 SNAPSHOT ACTUAL ==="
            cat "$SNAPSHOT"
            echo "=== END C19 SNAPSHOT ACTUAL ==="
          else
            echo "::error::Expected generated C19 snapshot was not found at $SNAPSHOT"
            find mtg-sets/build -maxdepth 5 -type f -name 'C19.json' -print || true
          fi
          exit "$STATUS"
