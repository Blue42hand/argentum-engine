name: Arcane Denial rebless

on:
  push:
    branches: ["codex/issue-123-arcane-denial"]

permissions:
  contents: write

jobs:
  rebless:
    if: ${{ !contains(github.event.head_commit.message, '[snapshot-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/issue-123-arcane-denial
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rebless card snapshots
        run: ./gradlew :mtg-sets:test --tests "*CardDefinitionSnapshotTest" -DupdateSnapshots=true

      - name: Guard snapshot scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf 'Changed files after rebless:\n%s\n' "$changed"
          test "$changed" = "mtg-sets/src/test/resources/snapshots/cards/ALL.json"
          grep -q 'Arcane Denial' mtg-sets/src/test/resources/snapshots/cards/ALL.json
          git diff --check

      - name: Commit expected snapshot and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mtg-sets/src/test/resources/snapshots/cards/ALL.json
          git rm .github/workflows/arcane-denial-rebless.yml
          git commit -m 'test: bless Arcane Denial snapshot [snapshot-done]'
          git push origin HEAD:codex/issue-123-arcane-denial
