name: Issue 79 Victimize snapshot refresh

on:
  push:
    branches: [ "codex/issue-34-victimize-current-main" ]
    paths:
      - ".github/workflows/issue79-victimize-snapshot.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/issue-34-victimize-current-main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install just
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Rebless and preserve only the USG snapshot
        run: |
          set -euxo pipefail
          just rebless-cards
          CHANGED=$(git diff --name-only)
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = "mtg-sets/src/test/resources/snapshots/cards/USG.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mtg-sets/src/test/resources/snapshots/cards/USG.json
          git commit -m 'Update Victimize card snapshot'
          git push origin HEAD:codex/issue-34-victimize-current-main
