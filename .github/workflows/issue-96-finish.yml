name: Issue 96 finish verification

on:
  push:
    branches:
      - codex/issue-96-card-type-choice
    paths:
      - '.github/workflows/issue-96-finish.yml'

permissions:
  contents: write

jobs:
  finish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-96-card-type-choice
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply issue 96 completion patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/core/CardType.kt',
              '    companion object {\n        fun fromString(value: String): CardType? =',
              '    companion object {\n        /**\n         * The card types offered by generic "choose a card type" effects in ordinary games.\n         * Kept here so every chooser uses one typed, ordered vocabulary.\n         *\n         * This intentionally preserves the engine\'s pre-existing choice universe: the eight\n         * ordinary game card types, excluding Kindred and Vanguard. Card text that names an\n         * explicit subset should pass that subset instead.\n         */\n        val DEFAULT_CHOOSABLE_TYPES: List<CardType> = listOf(\n            ARTIFACT, BATTLE, CREATURE, ENCHANTMENT, INSTANT, LAND, PLANESWALKER, SORCERY\n        )\n\n        fun fromString(value: String): CardType? ='
          )

          p = Path('rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/player/ChooseCardTypeForSourceExecutor.kt')
          s = p.read_text()
          if 'import com.wingedsheep.sdk.core.CardType\n' not in s:
              s = s.replace('import com.wingedsheep.engine.core.suspendForDecision\n', 'import com.wingedsheep.engine.core.suspendForDecision\nimport com.wingedsheep.sdk.core.CardType\n', 1)
          old = '    /** The card types (CR 205.2a) offered when the effect doesn\'t restrict the set. */\n    private val allCardTypes = listOf(\n        "Artifact", "Battle", "Creature", "Enchantment", "Instant", "Land", "Planeswalker", "Sorcery"\n    )\n\n'
          if old not in s:
              raise SystemExit('existing ChooseCardTypeForSourceExecutor default list not found')
          s = s.replace(old, '', 1)
          s = s.replace('val options = effect.allowedCardTypes ?: allCardTypes', 'val options = effect.allowedCardTypes ?: CardType.DEFAULT_CHOOSABLE_TYPES.map { it.displayName }', 1)
          p.write_text(s)

          for path, import_anchor, variable in [
              ('rules-engine/src/main/kotlin/com/wingedsheep/engine/mechanics/stack/StackResolver.kt', 'import com.wingedsheep.sdk.core.Color\n', 'cardTypeOptions'),
              ('rules-engine/src/main/kotlin/com/wingedsheep/engine/handlers/effects/PermanentEntryReplacements.kt', 'import com.wingedsheep.sdk.core.Subtype\n', 'options'),
          ]:
              p = Path(path)
              s = p.read_text()
              if 'import com.wingedsheep.sdk.core.CardType\n' not in s:
                  s = s.replace(import_anchor, import_anchor + 'import com.wingedsheep.sdk.core.CardType\n', 1)
              old = f'val {variable} = choice.allowedCardTypes\n                    ?: return ExecutionResult.error(state, "CARD_TYPE EntersWithChoice requires allowedCardTypes")'
              new = f'val {variable} = choice.allowedCardTypes\n                    ?: CardType.DEFAULT_CHOOSABLE_TYPES'
              if old not in s:
                  raise SystemExit(f'CARD_TYPE fallback block not found in {path}')
              s = s.replace(old, new, 1)
              marker = f'val {variable} = choice.allowedCardTypes'
              idx = s.index(marker)
              head, tail = s[:idx], s[idx:]
              prompt = 'prompt = "Choose a creature type"'
              if prompt not in tail:
                  raise SystemExit(f'CARD_TYPE prompt not found after branch marker in {path}')
              s = head + tail.replace(prompt, 'prompt = "Choose a card type"', 1)
              p.write_text(s)

          replace_once(
              'mtg-sdk/src/main/kotlin/com/wingedsheep/sdk/serialization/CardLinter.kt',
              '        "CREATURE_TYPE" to "CREATURE_TYPE",\n',
              '        "CREATURE_TYPE" to "CREATURE_TYPE",\n        "CARD_TYPE" to "CARD_TYPE",\n'
          )

          docs = Path('docs/card-sdk-language-reference.md')
          text = docs.read_text()
          marker = '#### `EntersWithChoice(ChoiceType.CARD_TYPE)`'
          if marker not in text:
              text += '\n\n#### `EntersWithChoice(ChoiceType.CARD_TYPE)`\n\nUse this replacement for “as this permanent enters, choose a card type.” The choice is\nstored durably in `ChoiceSlot.CARD_TYPE` as the chosen type\'s display name, so existing\nchosen-card-type predicates and cost modifiers can read it. `allowedCardTypes` restricts\nthe menu for text that names a subset (for example Cloud Key); when it is omitted, the\nengine uses `CardType.DEFAULT_CHOOSABLE_TYPES`, the same ordered universe used by\n`ChooseCardTypeForSourceEffect`. Both cast-permanent resolution and direct entry paths\n(land/token entry through `PermanentEntryReplacements`) use the same decision/persistence\ncontract.\n'
              docs.write_text(text)

          test_b64 = ''
          Path('rules-engine/src/test/kotlin/com/wingedsheep/engine/scenarios/EntersWithCardTypeChoiceTest.kt').write_bytes(base64.b64decode(test_b64))
          PY
      - name: Compile SDK, engine, and Assay
        run: ./gradlew :mtg-sdk:compileKotlin :rules-engine:compileKotlin :oracle-assay:compileKotlin --no-daemon
      - name: Run focused CARD_TYPE entry tests
        run: ./gradlew :rules-engine:test --tests '*EntersWithCardTypeChoiceTest' --no-daemon
      - name: Run SDK and rules-engine tests
        run: ./gradlew :mtg-sdk:test :rules-engine:test --no-daemon
      - name: Run Assay gate
        run: just assay-gate --limit 2000
      - name: Commit verified completion and remove staging workflow
        shell: bash
        run: |
          rm .github/workflows/issue-96-finish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mtg-sdk rules-engine docs .github/workflows/issue-96-finish.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Complete card-type choices for EntersWithChoice'
          git push origin HEAD:codex/issue-96-card-type-choice
