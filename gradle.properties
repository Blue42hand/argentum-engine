# Enable the build cache to save time by reusing outputs produced by other successful builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enable the configuration cache to reuse the build configuration and enable parallel task execution.
# (Note that some plugins may not yet be compatible with the configuration cache.)
# https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true

# === Heap split between the Gradle daemon and the Kotlin compile daemon ========================
# Every OOM we have actually observed came from the *Kotlin* daemon's FIR frontend, never from the
# Gradle daemon — the stacks root in FirTowerResolver / FirLookupTrackerComponent and are reported
# over RMI from the compile daemon (see docs/build-performance-plan.md). The Gradle daemon meanwhile
# reported single-digit-percent heap use of its 4g. So the two are sized for what they actually do:
# the Gradle daemon runs the task graph, the Kotlin daemon holds whole source sets of resolved FIR.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
# -XX:+UseParallelGC makes a genuinely undersized compile daemon fail fast with "GC overhead limit
# exceeded" instead of grinding for minutes at 99% GC, which is how these OOMs used to present.
kotlin.daemon.jvmargs=-Xmx6g -XX:+UseParallelGC

# Bound how many Kotlin compilations may run at once, across the whole build (see the shared build
# service in buildSrc/.../KotlinCompileThrottle.kt). They all share ONE compile daemon heap, so
# `org.gradle.workers.max` alone does not bound peak compiler memory — six concurrent compilations
# meant six live FIR sessions in one 4g JVM. Raise with -PkotlinCompileParallelism=N on a big machine.
kotlinCompileParallelism=2

# Per-task compile metrics (time, GC, memory) so a source set growing back past the point where it
# needs its own module is visible before it OOMs again. Written under <module>/build/reports/kotlin-build.
kotlin.build.report.output=file
kotlin.js.ir.output.granularity=whole-program
